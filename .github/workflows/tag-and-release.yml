name: tag-and-release

on:
  push:
    branches:
      - main
    paths: 'aws-connect'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Get version
        id: get_version
        run: |
          version=$(grep "^version=" aws-connect |cut -f2 -d"=")
          echo version=$version >> $GITHUB_OUTPUT
          echo version_tag=v$version >> $GITHUB_OUTPUT

      - name: Create tagger app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAGGER_APP_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}

      - name: Tag commit
        uses: tvdias/github-tagger@ed7350546e3e503b5e942dffd65bc8751a95e49d # v0.0.2
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          tag: "${{steps.get_version.outputs.version_tag}}"

      - name: Extract from changelog
        id: extract_changes
        run: |
          # Must use a temporary file or it loses the formatting
          VERSION=${{steps.get_version.outputs.version}}; awk "/## \[$VERSION\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > REL-BODY.md

      - name: Create Relase TAR
        id: create_tar
        run: |
          tar cvzf ./aws-connect-${{steps.get_version.outputs.version}}.tar.gz aws-connect* README.md

      - name: Generate Checksum
        id: generate_checksum
        run: |
          checksum=$(sha256sum ./aws-connect-${{steps.get_version.outputs.version}}.tar.gz | awk '{print $1}')
          echo "${checksum}" > sha256.sum
          echo "SHA256: ${checksum}" >> REL-BODY.md

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{steps.get_version.outputs.version_tag}}
          artifacts: "CHANGELOG.md, sha256.sum, aws-connect*.tar.gz"
          bodyFile: "REL-BODY.md"
          token: ${{ steps.app-token.outputs.token }}
          # An immutable release is sealed the moment it is published, so assets
          # have to land while it is still a draft. This creates the draft,
          # uploads, then publishes.
          immutableCreate: true
          # Upload failures used to be warnings, so v1.1.2 published empty with a
          # green check. Fail the build instead.
          artifactErrorsFailBuild: true

      - name: Delete stranded draft release
        if: ${{ failure() && steps.create_release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{steps.get_version.outputs.version_tag}}
        run: |
          set -o pipefail
          # The releases list lags creation by a second or two, so poll before giving up.
          ids=""
          for _ in 1 2 3 4 5; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | select(.draft and .tag_name == env.TAG) | .id') || ids=""
            [ -n "$ids" ] && break
            sleep 3
          done
          if [ -z "$ids" ]; then
            echo "No draft release for ${TAG}; nothing to clean up."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting stranded draft ${id} for ${TAG}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
